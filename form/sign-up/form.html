
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section>

        <video class="bg-video" autoplay muted loop playsinline>
            <source src="bg.mp4" type="video/mp4">
        </video>

        <div class="login-box">

            <form>

                <h2>Let's Join Us</h2>

                <div class="input">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14z"/>
                        </svg>
                    </span>
                    <input type="text" placeholder="First Name" required>
                </div>

                <div class="input">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14z"/>
                        </svg>
                    </span>
                    <input type="text" placeholder="Last Name" required>
                </div>

                <div class="input">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1.5 1.5 0 0 1 1.6-.3c1 .4 2.1.6 3.2.6a1.5 1.5 0 0 1 1.5 1.5V20a1.5 1.5 0 0 1-1.5 1.5C11.9 21.5 2.5 12.1 2.5 1.5A1.5 1.5 0 0 1 4 0h3a1.5 1.5 0 0 1 1.5 1.5c0 1.1.2 2.2.6 3.2a1.5 1.5 0 0 1-.3 1.6l-2.2 2.2z"/>
                        </svg>
                    </span>
                   <input type="text"
                        placeholder="Phone Number"
                        inputmode="numeric"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>

                <div class="input">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                    </span>
                    <input type="email" placeholder="Email" required>
                </div>

                <div class="input">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7zm2 10a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
                        </svg>
                    </span>
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="input sex-input">

                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                            <g>
                                <path d="M444.863,48.361l-15.078-15.07l14.141-14.141l-0.062-0.062c0.359-0.273,0.688-0.555,1.016-0.875c4.156-4.172,4.156-10.922,0-15.086c-4.172-4.172-10.922-4.172-15.094,0c-0.312,0.32-0.594,0.656-0.875,1.008l-0.062-0.07l-14.141,14.148L399.645,3.15c-4.172-4.164-10.922-4.164-15.094,0c-4.172,4.172-4.172,10.922,0,15.086l15.062,15.07l-38.047,38.062c-21.703-18.109-48.391-27.172-75.078-27.172c-30.031,0-60.062,11.461-82.969,34.367c-25.391,25.391-36.703,59.516-33.953,92.703c-59.281,5.906-105.562,55.922-105.562,116.75c0,61.203,46.859,111.453,106.656,116.844v53.812h-21.312c-5.891,0-10.656,4.781-10.656,10.672s4.766,10.672,10.656,10.672h21.312v20c0,5.891,4.781,10.672,10.672,10.672s10.672-4.781,10.672-10.672v-20h21.312c5.891,0,10.672-4.781,10.672-10.672s-4.781-10.672-10.672-10.672h-21.312v-53.812c59.797-5.391,106.656-55.641,106.656-116.844c0-3.281-0.141-6.531-0.406-9.75c26-2.594,51.281-13.859,71.203-33.766c43.266-43.281,45.672-111.953,7.188-158.047l38.062-38.062l15.062,15.062c4.172,4.172,10.922,4.172,15.094,0C449.035,59.283,449.02,52.533,444.863,48.361z M249.207,355.877c-18.125,18.141-42.234,28.125-67.875,28.125s-49.75-9.984-67.875-28.125c-18.141-18.125-28.125-42.234-28.125-67.875s9.984-49.75,28.125-67.883c16.203-16.219,37.203-25.906,59.797-27.781c5.172,19.102,15.266,37.148,30.266,52.148c20.469,20.453,46.594,31.766,73.344,33.953c0.312,3.156,0.469,6.344,0.469,9.562C277.332,313.643,267.348,337.752,249.207,355.877z M195.77,193.072c20.156,3.023,38.766,12.367,53.438,27.047c10.422,10.414,18.141,22.805,22.844,36.32c-20.172-3.023-38.766-12.359-53.453-27.039C208.191,218.986,200.457,206.596,195.77,193.072z M382.488,161.518c0,25.641-9.984,49.75-28.125,67.883c-16.203,16.211-37.203,25.906-59.797,27.773c-12.734-46.859-53.766-82.07-103.609-86.109c-0.312-3.156-0.469-6.344-0.469-9.547c0-25.641,9.984-49.75,28.109-67.883c18.141-18.133,42.25-28.117,67.891-28.117s49.75,9.984,67.875,28.117C372.504,111.768,382.488,135.877,382.488,161.518z"/>
                            </g>
                        </svg>
                    </span>

                    <label>Sex</label>

                    <div class="sex">
                        <label>
                            <input type="radio" name="sex" value="male">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="sex" value="female">
                            Female
                        </label>
                    </div>

                </div>

                <div class="form-group">

                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 4h-1V2h-2v2H8V2H6v2H5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm1 15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8h16v8zm0-10H4V7a1 1 0 0 1 1-1h1v2h2V6h8v2h2V6h1a1 1 0 0 1 1 1v2z"/>
                        </svg>
                    </span>

                    <label>Date of Birth</label>

                    <div class="birth-date">
                        <input type="number" placeholder="Year" min="1900" max="2026">

                        <select>
                            <option disabled selected>Month</option>
                            <option>January</option>
                            <option>February</option>
                            <option>March</option>
                            <option>April</option>
                            <option>May</option>
                            <option>June</option>
                            <option>July</option>
                            <option>August</option>
                            <option>September</option>
                            <option>October</option>
                            <option>November</option>
                            <option>December</option>
                        </select>

                        <input type="number" placeholder="Day" min="1" max="31">
                    </div>

                    <div class="remember-forgot">
                        <label>
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit">Sign Up</button>

                    <div class="register-link">
                        <p>
                            Have an account?
                            <a href="#">Sign In</a>
                        </p>
                    </div>

                </div>

            </form>

        </div>

    </section>

</body>

</html>
